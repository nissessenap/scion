# ko configuration for building the scion hub/broker container image.
# See: https://ko.build/configuration/
defaultBaseImage: cgr.dev/chainguard/static:latest

builds:
  - id: scion
    main: ./cmd/scion
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/GoogleCloudPlatform/scion/pkg/version.Version={{.Env.VERSION}}
      - -X github.com/GoogleCloudPlatform/scion/pkg/version.Commit={{.Env.COMMIT}}
      - -X github.com/GoogleCloudPlatform/scion/pkg/version.BuildTime={{.Env.BUILD_TIME}}
    env:
      - CGO_ENABLED=0
